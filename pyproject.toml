[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slemodel"
version = "1.0.0"
description = "Multimodal deep learning from unpaired clinical multi-omics cohorts"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "torch==2.5.1",
  "POT==0.9.5",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "statsmodels==0.14.5",
]

[project.optional-dependencies]
analysis = [
  "adjustText==1.3.0",
  "captum==0.8.0",
  "gseapy==1.1.10",
  "networkx==3.3",
  "openpyxl>=3.1,<4",
  "Pillow==11.0.0",
  "pycirclize==1.10.1",
  "rapidfuzz>=3.9,<4",
  "requests==2.32.3",
  "shap==0.48.0",
  "tqdm>=4.66,<5",
  "xgboost==3.0.3",
]
[project.scripts]
slemodel-train = "slemodel.train:run_repeated_cv"
slemodel-summarize = "slemodel.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]
